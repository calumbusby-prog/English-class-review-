services:
  - type: web
    name: english-class-review
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      # Lets an AI actually read docs and write correct exercises, instead
      # of the free regex-based parser. Set ANTHROPIC_API_KEY (paid, best
      # quality) or GEMINI_API_KEY (free tier, see README.md) — either or
      # both. Without either, falls back to the free parser automatically.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # For docs shared "Anyone with the link can view" — see README.md.
      - key: GOOGLE_API_KEY
        sync: false
      # For private docs, via a service account instead — see README.md.
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      # Classes are normally configured in server/classes.json (committed
      # to the repo) instead of here. Only set this if you want a class
      # that isn't committed to the repo — see server/classes.js.
      - key: CLASS_FOLDERS_JSON
        sync: false
    autoDeploy: true
